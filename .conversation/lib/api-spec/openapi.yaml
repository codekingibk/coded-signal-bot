openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Coded Signal Bot customer and admin API
servers:
  - url: /api
tags:
  - name: health
  - name: public
  - name: access
  - name: signals
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/config:
    get:
      operationId: getPublicConfig
      tags: [public]
      summary: Public product and pricing configuration
      responses:
        "200":
          description: Public configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfig"
  /payment/initialize:
    post:
      operationId: initializePayment
      tags: [public]
      summary: Initialize a Paystack transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInitializeInput"
      responses:
        "200":
          description: Paystack authorization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInitializeResponse"
        "400":
          description: Invalid payment request
  /payment/verify/{reference}:
    get:
      operationId: verifyPayment
      tags: [public]
      summary: Verify a Paystack transaction and issue an access key
      parameters:
        - $ref: "#/components/parameters/Reference"
      responses:
        "200":
          description: Verified payment and access key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentVerification"
        "400":
          description: Payment not verified
  /payment/webhook:
    post:
      operationId: receivePaymentWebhook
      tags: [public]
      summary: Receive a signed Paystack event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentWebhookInput"
      responses:
        "200":
          description: Event received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /access/validate:
    post:
      operationId: validateAccessKey
      tags: [access]
      summary: Validate an access key without activating it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessKeyInput"
      responses:
        "200":
          description: Key validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessValidation"
        "400":
          description: Invalid key
  /access/activate:
    post:
      operationId: activateAccessKey
      tags: [access]
      summary: Activate an access key and create an access session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessKeyInput"
      responses:
        "200":
          description: Activated access session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessStatus"
        "400":
          description: Key cannot be activated
  /access/status:
    get:
      operationId: getAccessStatus
      tags: [access]
      summary: Read current access session status
      responses:
        "200":
          description: Access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessStatus"
  /access/logout:
    post:
      operationId: logoutAccess
      tags: [access]
      summary: End the current access session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /signals/current:
    get:
      operationId: getCurrentSignal
      tags: [signals]
      summary: Read the current protected signal
      responses:
        "200":
          description: Current signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalSnapshot"
        "401":
          description: Active access required
  /signals/history:
    get:
      operationId: getSignalHistory
      tags: [signals]
      summary: Read recent signal history
      responses:
        "200":
          description: Signal history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignalRecord"
  /referrals:
    get:
      operationId: getReferralProgress
      tags: [signals]
      summary: Read anonymous referral progress
      responses:
        "200":
          description: Referral progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralProgress"
  /streak:
    get:
      operationId: getStreak
      tags: [signals]
      summary: Read access identity streak
      responses:
        "200":
          description: Streak progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakProgress"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Sign in to the admin console
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid credentials
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: End the admin session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /admin/me:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Read the current admin session
      responses:
        "200":
          description: Admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Admin login required
  /admin/password:
    post:
      operationId: changeAdminPassword
      tags: [admin]
      summary: Change the bootstrap or current admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Read overview metrics
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/pricing:
    patch:
      operationId: updatePricing
      tags: [admin]
      summary: Update pricing and duration settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingUpdate"
      responses:
        "200":
          description: Updated public configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfig"
  /admin/giveaway:
    post:
      operationId: generateGiveawayCodes
      tags: [admin]
      summary: Generate giveaway access codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiveawayInput"
      responses:
        "200":
          description: Newly generated codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedCode"
  /admin/codes:
    get:
      operationId: listAccessCodes
      tags: [admin]
      summary: List access codes
      responses:
        "200":
          description: Access codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessCode"
  /admin/codes/{id}/revoke:
    post:
      operationId: revokeAccessCode
      tags: [admin]
      summary: Revoke an access code
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Revoked code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCode"
  /admin/payments:
    get:
      operationId: listPayments
      tags: [admin]
      summary: List payments
      responses:
        "200":
          description: Payment records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentRecord"
components:
  parameters:
    Reference:
      name: reference
      in: path
      required: true
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Message:
      type: object
      properties:
        message: { type: string }
      required: [message]
    PublicConfig:
      type: object
      properties:
        productName: { type: string }
        standardPrice: { type: integer }
        promoPrice: { type: integer }
        currency: { type: string }
        promoEnabled: { type: boolean }
        durationSeconds: { type: integer }
        paystackPublicKey: { type: ["string", "null"] }
        whatsappUrl: { type: string }
      required: [productName, standardPrice, promoPrice, currency, promoEnabled, durationSeconds, paystackPublicKey, whatsappUrl]
    PaymentInitializeInput:
      type: object
      properties:
        email: { type: string, format: email }
        referralCode: { type: ["string", "null"] }
      required: [email]
    PaymentWebhookInput:
      type: object
      additionalProperties: true
    PaymentInitializeResponse:
      type: object
      properties:
        authorizationUrl: { type: string }
        accessCode: { type: string }
        reference: { type: string }
        amount: { type: integer }
        currency: { type: string }
      required: [authorizationUrl, accessCode, reference, amount, currency]
    PaymentVerification:
      type: object
      properties:
        verified: { type: boolean }
        accessKey: { type: ["string", "null"] }
        reference: { type: string }
        message: { type: string }
      required: [verified, accessKey, reference, message]
    AccessKeyInput:
      type: object
      properties:
        key: { type: string, minLength: 8 }
      required: [key]
    AccessValidation:
      type: object
      properties:
        valid: { type: boolean }
        status: { type: string }
        durationSeconds: { type: integer }
        redeemBefore: { type: ["string", "null"], format: date-time }
      required: [valid, status, durationSeconds, redeemBefore]
    AccessStatus:
      type: object
      properties:
        authenticated: { type: boolean }
        expiresAt: { type: ["string", "null"], format: date-time }
        remainingSeconds: { type: integer }
        keyPrefix: { type: ["string", "null"] }
        source: { type: ["string", "null"] }
      required: [authenticated, expiresAt, remainingSeconds, keyPrefix, source]
    SignalSnapshot:
      type: object
      properties:
        current:
          $ref: "#/components/schemas/SignalRecord"
        next:
          $ref: "#/components/schemas/SignalRecord"
        serverTime: { type: string, format: date-time }
        cycleSeconds: { type: integer }
      required: [current, next, serverTime, cycleSeconds]
    SignalRecord:
      type: object
      properties:
        id: { type: integer }
        multiplier: { type: number }
        status: { type: string }
        generatedAt: { type: string, format: date-time }
        resultAt: { type: ["string", "null"], format: date-time }
      required: [id, multiplier, status, generatedAt, resultAt]
    ReferralProgress:
      type: object
      properties:
        code: { type: string }
        confirmed: { type: integer }
        required: { type: integer }
        rewardIssued: { type: boolean }
      required: [code, confirmed, required, rewardIssued]
    StreakProgress:
      type: object
      properties:
        current: { type: integer }
        longest: { type: integer }
        discountPercent: { type: integer }
        lastActivity: { type: ["string", "null"], format: date-time }
      required: [current, longest, discountPercent, lastActivity]
    AdminLoginInput:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 200 }
      required: [email, password]
    AdminSession:
      type: object
      properties:
        authenticated: { type: boolean }
        email: { type: ["string", "null"] }
        forcePasswordChange: { type: boolean }
      required: [authenticated, email, forcePasswordChange]
    PasswordChangeInput:
      type: object
      properties:
        currentPassword: { type: string, minLength: 8, maxLength: 200 }
        newPassword: { type: string, minLength: 8, maxLength: 200 }
      required: [currentPassword, newPassword]
    AdminOverview:
      type: object
      properties:
        activeSessions: { type: integer }
        activeKeys: { type: integer }
        expiredKeys: { type: integer }
        totalPayments: { type: integer }
        successfulPayments: { type: integer }
        revenue: { type: integer }
        generatedCodes: { type: integer }
        recentActivity:
          type: array
          items: { type: string }
      required: [activeSessions, activeKeys, expiredKeys, totalPayments, successfulPayments, revenue, generatedCodes, recentActivity]
    PricingUpdate:
      type: object
      properties:
        standardPrice: { type: integer, minimum: 1 }
        promoPrice: { type: integer, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        promoEnabled: { type: boolean }
        durationSeconds: { type: integer, minimum: 3600 }
      required: [standardPrice, promoPrice, currency, promoEnabled, durationSeconds]
    GiveawayInput:
      type: object
      properties:
        quantity: { type: integer, minimum: 1, maximum: 500 }
        durationSeconds: { type: integer, minimum: 3600 }
        maxUses: { type: integer, minimum: 1 }
        redeemBefore: { type: ["string", "null"], format: date-time }
      required: [quantity, durationSeconds, maxUses, redeemBefore]
    GeneratedCode:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        durationSeconds: { type: integer }
        maxUses: { type: integer }
        redeemBefore: { type: ["string", "null"], format: date-time }
      required: [id, code, durationSeconds, maxUses, redeemBefore]
    AccessCode:
      type: object
      properties:
        id: { type: integer }
        prefix: { type: string }
        source: { type: string }
        durationSeconds: { type: integer }
        maxUses: { type: integer }
        uses: { type: integer }
        status: { type: string }
        redeemBefore: { type: ["string", "null"], format: date-time }
        activatedAt: { type: ["string", "null"], format: date-time }
        expiresAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, prefix, source, durationSeconds, maxUses, uses, status, redeemBefore, activatedAt, expiresAt, createdAt]
    PaymentRecord:
      type: object
      properties:
        id: { type: integer }
        reference: { type: string }
        amount: { type: integer }
        currency: { type: string }
        status: { type: string }
        customerEmail: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        verifiedAt: { type: ["string", "null"], format: date-time }
      required: [id, reference, amount, currency, status, customerEmail, createdAt, verifiedAt]